[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getresponse-mcp"
version = "0.1.0"
description = "MCP server for GetResponse email marketing platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Mateusz Kaminski" },
]
keywords = ["mcp", "getresponse", "email-marketing", "ai", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp",
    "httpx",
]

[project.scripts]
getresponse-mcp = "getresponse_mcp.server:mcp.run"

[project.urls]
Homepage = "https://github.com/mateuszkamiinski/getresponse-mcp"
Repository = "https://github.com/mateuszkamiinski/getresponse-mcp"
Issues = "https://github.com/mateuszkamiinski/getresponse-mcp/issues"
